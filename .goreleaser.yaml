version: 2
project_name: omnishell
before:
  hooks:
    - go mod tidy
    - make dist-assets
builds:
  - id: omnishell
    main: ./cmd/omnishell
    binary: omnishell
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/JtheGunner/omnishell/internal/buildinfo.Version={{.Version}}
      - -X github.com/JtheGunner/omnishell/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/JtheGunner/omnishell/internal/buildinfo.Date={{.Date}}
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: build/assets/completions/*
        dst: completions
      - src: build/assets/man/*.1
        dst: man
      - README.md
      - LICENSE
checksum:
  name_template: checksums.txt
brews:
  - repository:
      owner: JtheGunner
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: JtheGunner
      email: JtheGunner@users.noreply.github.com
    homepage: https://github.com/JtheGunner/omnishell
    description: Modular, declarative terminal configuration for macOS and Linux
    install: |
      bin.install "omnishell"
      bash_completion.install "completions/omnishell.bash" => "omnishell"
      zsh_completion.install "completions/_omnishell"
      man1.install Dir["man/*.1"]
    test: system "#{bin}/omnishell version"
release:
  github:
    owner: JtheGunner
    name: omnishell
