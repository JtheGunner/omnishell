name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    # Local self-hosted runner (see CLAUDE.md). A fork PR must never run there:
    # the runner mounts the host's Docker socket, so it falls back to GitHub-hosted.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","local","docker","debian"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test ./... -race -count=1 -covermode=atomic -coverprofile=coverage.out
      - name: Coverage summary
        run: |
          {
            echo "### Test coverage"
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: golangci/golangci-lint-action@v9
        with: { version: v2.13 }
  vuln:
    # Local self-hosted runner (see CLAUDE.md). A fork PR must never run there:
    # the runner mounts the host's Docker socket, so it falls back to GitHub-hosted.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","local","docker","debian"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1
        with:
          # govulncheck@latest tracks the newest Go release; pinning a minor
          # version breaks this job whenever govulncheck raises its minimum.
          go-version-input: 'stable'
          repo-checkout: false
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    # The ubuntu leg uses the local runner (fork PRs excepted); macOS needs a
    # GitHub-hosted macOS runner.
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-latest' || (github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","local","docker","debian"]')) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go build ./...
      - run: go run ./cmd/omnishell version
