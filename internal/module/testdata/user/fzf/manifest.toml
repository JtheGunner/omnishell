platforms = ["macos", "linux"]
shells    = ["zsh", "bash"]
requires  = []
after     = ["completion"]

[module]
id          = "fzf"
name        = "FZF Fuzzy Finder"
description = "Ctrl+R history search as a searchable list"
version     = "9.9.9"
schema      = 1

[packages]
brew   = ["fzf"]
apt    = ["fzf"]
dnf    = ["fzf"]
pacman = ["fzf"]
zypper = ["fzf"]
apk    = ["fzf"]

[[packages.fallback]]
type = "git"
repo = "https://github.com/junegunn/fzf.git"
dest = "{{.VendorDir}}/fzf"
run  = ["{{.VendorDir}}/fzf/install", "--bin"]

[options.ctrl_r]
type    = "bool"
default = true
help    = "Bind Ctrl+R to the fzf history widget"

[options.default_opts]
type    = "string"
default = "--height 40% --reverse"
help    = "FZF_DEFAULT_OPTS"

[options.replace]
type    = "list<enum>"
values  = ["ls", "cat", "find"]
default = []
