platforms   = ["macos", "linux"]
shells      = ["zsh", "bash"]
after       = ["completion"]

[module]
id          = "broot"
name        = "broot"
description = "A navigable directory-tree TUI; the `br` function cd's into the directory you pick"
homepage    = "https://github.com/Canop/broot"
version     = "1.0.0"
schema      = 1

# zypper / apk don't ship broot in the base repos, and older apt releases lack
# it too → the upstream release binary, with a source build only where no
# release binary exists for the host.
[packages]
brew   = ["broot"]
apt    = ["broot"]
dnf    = ["broot"]
pacman = ["broot"]

[[packages.fallback]]
type = "release"
repo = "https://github.com/Canop/broot"
ref  = "v1.61.0"
bin  = "broot"

[[packages.fallback.assets]]
os     = "linux"
arch   = "amd64"
url    = "https://github.com/Canop/broot/releases/download/{{.Ref}}/broot_{{.Version}}.zip"
sha256 = "6cafe8e993fb8e5684eb25549703a4fb9dec61ac6a8f1947cbed6566cb4e58e5"
member = "x86_64-unknown-linux-musl/broot"

[[packages.fallback.assets]]
os     = "linux"
arch   = "arm64"
url    = "https://github.com/Canop/broot/releases/download/{{.Ref}}/broot_{{.Version}}.zip"
sha256 = "6cafe8e993fb8e5684eb25549703a4fb9dec61ac6a8f1947cbed6566cb4e58e5"
member = "aarch64-unknown-linux-musl/broot"

[[packages.fallback]]
type = "git"
repo = "https://github.com/Canop/broot.git"
dest = "{{.VendorDir}}/broot"
ref  = "v1.61.0"
run  = ["cargo", "install", "--locked", "--path", "{{.VendorDir}}/broot", "--root", "{{.VendorDir}}"]
requires = ["cargo>=1.85"]

[options.cmd]
type    = "string"
default = "br"
pattern = "^[A-Za-z_][A-Za-z0-9_-]*$"
help    = "Name of the shell function that opens broot and cd's on exit"
