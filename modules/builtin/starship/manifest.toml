platforms   = ["macos", "linux"]
shells      = ["zsh", "bash"]
after       = ["completion", "fzf-tab", "tmux"]
conflicts   = ["omnishell-prompt"]

[module]
id          = "starship"
name        = "starship"
description = "The minimal, blazing-fast cross-shell prompt; seeds a curated config the first time it runs"
homepage    = "https://starship.rs"
version     = "1.0.0"
schema      = 1

# starship is in brew / pacman / apk and recent apt; dnf / zypper and older
# releases install the upstream release binary, and only build from source
# (starship is Rust) where no release binary exists for the host.
[packages]
brew   = ["starship"]
apt    = ["starship"]
pacman = ["starship"]
apk    = ["starship"]

[[packages.fallback]]
type = "release"
repo = "https://github.com/starship/starship"
ref  = "v1.27.0"
bin  = "starship"

[[packages.fallback.assets]]
os     = "linux"
arch   = "amd64"
url    = "https://github.com/starship/starship/releases/download/{{.Ref}}/starship-x86_64-unknown-linux-musl.tar.gz"
sha256 = "10c8eb4cb3b761d9bf59ea828444c2dab36c900b7d69a69e08814b286969df89"
member = "starship"

[[packages.fallback.assets]]
os     = "linux"
arch   = "arm64"
url    = "https://github.com/starship/starship/releases/download/{{.Ref}}/starship-aarch64-unknown-linux-musl.tar.gz"
sha256 = "341f5cbf24699fa0b27ec88965ad25f862ea09e15d35a543fd6ffdff1d2aa00d"
member = "starship"

# One armv6-compatible hard-float build serves every 32-bit ARM variant.
[[packages.fallback.assets]]
os     = "linux"
arch   = "arm"
url    = "https://github.com/starship/starship/releases/download/{{.Ref}}/starship-arm-unknown-linux-musleabihf.tar.gz"
sha256 = "33531a104304e8f36e1f78657039246ebb730e4c53a7ccdf8c94c0e3630bf6b4"
member = "starship"

[[packages.fallback]]
type = "git"
repo = "https://github.com/starship/starship.git"
dest = "{{.VendorDir}}/starship"
ref  = "v1.27.0"
run  = ["cargo", "install", "--locked", "--path", "{{.VendorDir}}/starship", "--root", "{{.VendorDir}}"]
requires = ["cargo>=1.95"]
