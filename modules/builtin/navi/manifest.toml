platforms   = ["macos", "linux"]
shells      = ["zsh", "bash"]
requires    = ["fzf"]
after       = ["fzf", "atuin", "completion"]

[module]
id          = "navi"
name        = "navi"
description = "Interactive cheatsheet browser: pick a command from your cheatsheets and fill in its arguments (Ctrl+G)"
homepage    = "https://github.com/denisidoro/navi"
version     = "1.0.0"
schema      = 1

# navi uses fzf as its selector, hence `requires`. Managers that lack the
# package fall back to the pinned release binary below.
[packages]
brew   = ["navi"]
apt    = ["navi"]
dnf    = ["navi"]
pacman = ["navi"]
zypper = ["navi"]
apk    = ["navi"]

[[packages.fallback]]
type = "release"
repo = "https://github.com/denisidoro/navi"
ref  = "v2.24.0"
bin  = "navi"

[[packages.fallback.assets]]
os     = "linux"
arch   = "amd64"
url    = "https://github.com/denisidoro/navi/releases/download/{{.Ref}}/navi-v2.24.0-x86_64-unknown-linux-musl.tar.gz"
sha256 = "f334047479241f7c8b48d091f4e814dcc798a51a74dfd04ee63cbf67e8c921ba"
member = "navi"

[[packages.fallback.assets]]
os     = "linux"
arch   = "arm64"
url    = "https://github.com/denisidoro/navi/releases/download/{{.Ref}}/navi-v2.24.0-aarch64-unknown-linux-gnu.tar.gz"
sha256 = "de99e69906a0e06ffd30a329645e15f9e96a6b42c49eaac8baccac9bc314768a"
member = "navi"

# navi ships no armv6 build.
[[packages.fallback.assets]]
os     = "linux"
arch   = "arm"
goarm  = "7"
url    = "https://github.com/denisidoro/navi/releases/download/{{.Ref}}/navi-v2.24.0-armv7-unknown-linux-musleabihf.tar.gz"
sha256 = "c43aaf8efcbc1b2a839bcb9750e083b26695a6b107debc38aa6ef0ae7c7a2f58"
member = "navi"

[options.key]
type    = "string"
default = "ctrl-g"
pattern = "^(ctrl|alt)-[a-z]$"
help    = "Key that opens navi: ctrl-<letter> or alt-<letter>. The default Ctrl+G is free in the fzf and atuin modules. Another key is bound in place of it and Ctrl+G is restored to its shell default (bash needs 4.0 or newer for that; older bash keeps Ctrl+G)"
