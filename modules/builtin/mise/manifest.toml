platforms   = ["macos", "linux"]
shells      = ["zsh", "bash"]
after       = ["completion"]

[module]
id          = "mise"
name        = "mise"
description = "Per-project runtime versions (node, python, go, …) from mise.toml / .tool-versions"
homepage    = "https://github.com/jdx/mise"
version     = "1.0.0"
schema      = 1

# mise is not in the base apt / dnf / zypper / apk repos (it ships its own),
# so only brew and pacman get a system package. Everything else installs the
# upstream release binary, and only builds from source where no release
# binary exists for the host.
[packages]
brew   = ["mise"]
pacman = ["mise"]

[[packages.fallback]]
type = "release"
repo = "https://github.com/jdx/mise"
ref  = "v2026.11.5"
bin  = "mise"

[[packages.fallback.assets]]
os     = "linux"
arch   = "amd64"
url    = "https://github.com/jdx/mise/releases/download/{{.Ref}}/mise-{{.Ref}}-linux-x64-musl.tar.gz"
sha256 = "5cf376858e091c4f3fe55b063f94bd3ee285ab611cec0cb1a9d6d7986c49a433"
member = "mise/bin/mise"

[[packages.fallback.assets]]
os     = "linux"
arch   = "arm64"
url    = "https://github.com/jdx/mise/releases/download/{{.Ref}}/mise-{{.Ref}}-linux-arm64-musl.tar.gz"
sha256 = "5b6a086507cd49e1135165ceaeb643e14af2f48b44bf5a67ce491db6b49dc9eb"
member = "mise/bin/mise"

# mise ships no armv6 build.
[[packages.fallback.assets]]
os     = "linux"
arch   = "arm"
goarm  = "7"
url    = "https://github.com/jdx/mise/releases/download/{{.Ref}}/mise-{{.Ref}}-linux-armv7-musl.tar.gz"
sha256 = "19dba9ca1ec848231ca9c320e6f5f5701a727ef11e46d32d6862d502d0e2d2a2"
member = "mise/bin/mise"

[[packages.fallback]]
type = "git"
repo = "https://github.com/jdx/mise.git"
dest = "{{.VendorDir}}/mise"
ref  = "v2026.11.5"
run  = ["cargo", "install", "--locked", "--path", "{{.VendorDir}}/mise", "--root", "{{.VendorDir}}"]
requires = ["cargo>=1.95", "cmake"]

[options.mode]
type    = "enum"
values  = ["activate", "shims"]
default = "activate"
help    = "activate = per-prompt hook (default); shims = PATH shims, which also work in non-interactive shells"
