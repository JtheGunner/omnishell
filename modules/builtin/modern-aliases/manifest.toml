platforms   = ["macos", "linux"]
shells      = ["zsh", "bash"]
after       = ["completion"]

[module]
id          = "modern-aliases"
name        = "Modern CLI aliases"
description = "Replace ls/cat/find with eza (https://github.com/eza-community/eza), bat (https://github.com/sharkdp/bat) and fd (https://github.com/sharkdp/fd) when selected"
version     = "1.0.0"
schema      = 1

# Package sets are per-tool; the engine installs the whole list for the
# detected manager. Users who only pick a subset via `replace` still get
# all three tools installed — acceptable and simple for v1.
[packages]
brew   = ["eza", "bat", "fd"]
apt    = ["eza", "bat", "fd-find"]
dnf    = ["eza", "bat", "fd-find"]
pacman = ["eza", "bat", "fd"]
zypper = ["eza", "bat", "fd"]
apk    = ["eza", "bat", "fd"]

# eza is missing from older distro releases (Debian 12, Ubuntu 22.04). There
# the upstream release binary stands in for it, and only for it: bat and fd
# still come from the package manager. amd64 is the static musl build; upstream
# has no musl build for arm64, so that asset links against glibc.
[[packages.fallback]]
type     = "release"
repo     = "https://github.com/eza-community/eza"
ref      = "v0.23.5"
bin      = "eza"
replaces = ["eza"]

[[packages.fallback.assets]]
os     = "linux"
arch   = "amd64"
url    = "https://github.com/eza-community/eza/releases/download/{{.Ref}}/eza_x86_64-unknown-linux-musl.tar.gz"
sha256 = "e06eebab74b73d6b7d51a796a353824b001bea82df077706382e100815d28904"
member = "eza"

[[packages.fallback.assets]]
os     = "linux"
arch   = "arm64"
url    = "https://github.com/eza-community/eza/releases/download/{{.Ref}}/eza_aarch64-unknown-linux-gnu.tar.gz"
sha256 = "40b87ae8628aa2ff0f0d2dc24ab52f689631366385c3da630bae745671fd71ec"
member = "eza"

[options.replace]
type    = "list<enum>"
values  = ["ls", "cat", "find"]
default = ["ls", "cat", "find"]
help    = "Which commands to alias to modern equivalents"
